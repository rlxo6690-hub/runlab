# RunLab 배포 — 앱 + Caddy(자동 HTTPS 리버스 프록시).
# 실행: docker compose up -d --build
# 도메인만 .env의 ALLOWED_HOSTS/SITE_DOMAIN에 넣으면 Caddy가 Let's Encrypt 인증서를 자동 발급.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - db:/app/backend/data        # sqlite DB 영구 보관 (DB_PATH=/app/backend/data/db.sqlite3)
      - media:/app/backend/media    # 업로드 파일 영구 보관
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db:
  media:
  caddy_data:
  caddy_config:
