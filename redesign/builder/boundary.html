<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경계 드로잉 도구 — RunLab</title>
  <link rel="icon" type="image/png" href="/img/mfg.png">
  <meta property="og:title" content="경계 드로잉 도구 — RunLab">
  <meta property="og:description" content="한국 행정구역(시도·시군구) 경계 위에 폴리곤·사각형을 그려 연구 영역을 정의하고 GeoJSON으로 내보냅니다.">
  <meta property="og:image" content="https://runlab.ai.kr/img/OG_IMAGE.jpg">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}

    :root{
      --bg:#f8fafc;
      --card:#ffffff;
      --card2:#f1f5f9;
      --border:rgba(0,0,0,.1);
      --border2:rgba(0,0,0,.15);
      --text:#1e293b;
      --muted:#64748b;
      --dim:#94a3b8;
      --accent:#2563eb;
      --accent2:#6366f1;
      --amber:#d97706;
      --green:#059669;
      --red:#dc2626;
      --orange:#ea580c;
      --r:10px;
    }

    body{
      font-family:'Noto Sans KR','Segoe UI',system-ui,-apple-system,sans-serif;
      background:var(--bg);color:var(--text);
      min-height:100vh;font-size:14px;line-height:1.6;
    }

    body::before{
      content:'';position:fixed;inset:0;
      background-image:
        linear-gradient(rgba(37,99,235,.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(37,99,235,.04) 1px,transparent 1px);
      background-size:40px 40px;pointer-events:none;z-index:0;
    }

    /* ── 헤더 ── */
    .site-header{
      padding:14px 24px;border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;
      background:rgba(248,250,252,.95);backdrop-filter:blur(16px);
      position:sticky;top:0;z-index:1000;
    }
    .logo{display:flex;align-items:center;gap:12px;}
    .logo-brand{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;
                color:var(--accent);letter-spacing:2px;text-decoration:none;}
    .logo-brand em{color:#ea580c;font-style:normal;}
    .logo-sep{width:1px;height:16px;background:var(--border2);flex-shrink:0;}
    .logo-title{font-size:13px;color:var(--muted);}
    .header-back{font-size:12px;color:var(--muted);text-decoration:none;
                 border:1px solid var(--border2);padding:5px 14px;border-radius:8px;transition:.2s;}
    .header-back:hover{color:var(--text);border-color:rgba(0,0,0,.3);}

    /* ── 레이아웃 ── */
    .page-wrap{max-width:1400px;margin:0 auto;position:relative;}
    .page{padding:0 24px 80px;}

    .intro-box{
      background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.15);
      border-radius:10px;padding:12px 16px;font-size:13px;color:var(--muted);
      line-height:1.7;margin-top:20px;margin-bottom:16px;
    }
    .intro-box strong{color:var(--text);}

    /* ── 상단 툴바 그리드 ── */
    .toolbar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;align-items:start;}

    /* ── 카드 ── */
    .a-card{
      background:var(--card);border:1px solid var(--border);
      border-radius:var(--r);padding:16px 18px;margin-bottom:16px;
    }
    .a-card:last-child{margin-bottom:0;}
    .a-card-title{
      font-size:10px;font-weight:700;color:var(--muted);
      letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px;
      display:flex;align-items:center;justify-content:space-between;gap:8px;
    }

    /* ── 기본 행정구역 선택 버튼 ── */
    .base-btn-list{display:flex;flex-direction:column;gap:6px;}
    .base-btn{
      display:flex;align-items:center;gap:8px;width:100%;min-height:38px;
      padding:9px 12px;font-size:12px;font-weight:600;color:var(--text);
      background:var(--card2);border:1px solid var(--border2);border-radius:8px;
      cursor:pointer;transition:all .2s;font-family:inherit;text-align:left;
    }
    .base-btn:hover{border-color:rgba(37,99,235,.4);}
    .base-btn.active{background:rgba(37,99,235,.1);border-color:var(--accent);color:var(--accent);}
    .b-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}

    /* ── 선택된 행정구역 다운로드 ── */
    .selected-region{display:none;margin-top:10px;padding:10px 12px;
      background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.3);border-radius:8px;}
    .selected-region.show{display:block;}
    .selected-region-hint{display:flex;align-items:center;justify-content:space-between;gap:8px;
      font-size:10px;color:var(--muted);margin-bottom:6px;}
    .selected-region-clear{font-size:10px;color:var(--muted);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit;padding:0;}
    .selected-region-clear:hover{color:var(--red);}
    .selected-region-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;max-height:130px;overflow-y:auto;}
    .selected-region-item{display:flex;align-items:center;gap:6px;padding:5px 8px;
      background:var(--card);border:1px solid var(--border2);border-radius:6px;
      font-size:11px;font-weight:600;color:var(--text);}
    .selected-region-item .sri-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .selected-region-item .sri-del{color:var(--dim);cursor:pointer;font-size:14px;padding:0 3px;line-height:1;flex-shrink:0;}
    .selected-region-item .sri-del:hover{color:var(--red);}
    .selected-region .btn{width:100%;min-height:36px;}

    /* ── 그리기 도구 버튼 ── */
    .tool-btn-row{display:flex;gap:8px;}
    .tool-btn{
      flex:1;min-height:38px;padding:9px 6px;font-size:12px;font-weight:700;color:var(--text);
      background:var(--card2);border:1px solid var(--border2);border-radius:8px;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
      transition:all .2s;font-family:inherit;
    }
    .tool-btn:hover{border-color:rgba(37,99,235,.4);}
    .tool-btn.active{background:rgba(37,99,235,.1);border-color:var(--accent);color:var(--accent);}

    /* ── 내 레이어 목록 ── */
    .layer-card{display:flex;flex-direction:column;}
    .layer-list{flex:1;overflow-y:auto;max-height:150px;display:flex;flex-direction:column;gap:6px;}
    .empty-hint{padding:16px 4px;font-size:12px;color:var(--dim);line-height:1.7;text-align:center;}
    .layer-item{
      display:flex;align-items:center;gap:8px;padding:8px 10px;
      background:var(--card2);border:1px solid var(--border);border-radius:8px;
      cursor:pointer;transition:.15s;
    }
    .layer-item:hover{border-color:rgba(37,99,235,.35);}
    .layer-item.selected{background:rgba(37,99,235,.08);border-color:var(--accent);}
    .l-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
    .l-name{flex:1;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .l-del{font-size:15px;color:var(--dim);cursor:pointer;padding:1px 6px;border-radius:4px;line-height:1.4;flex-shrink:0;}
    .l-del:hover{color:var(--red);background:rgba(220,38,38,.08);}

    /* ── 버튼 ── */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;
         font-size:12px;font-weight:700;font-family:inherit;
         border:none;border-radius:8px;cursor:pointer;transition:all .2s;white-space:nowrap;}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-primary:hover:not(:disabled){background:#1d4ed8;}
    .btn-outline{background:transparent;border:1px solid var(--border2);color:var(--muted);}
    .btn-outline:hover{color:var(--text);border-color:rgba(0,0,0,.3);}
    .btn-danger{background:rgba(220,38,38,.08);color:var(--red);border:1px solid rgba(220,38,38,.25);}
    .btn-danger:hover{background:rgba(220,38,38,.14);}
    .btn-row{display:flex;flex-direction:column;gap:8px;}
    .btn-row .btn{width:100%;min-height:40px;}

    /* ── 지도 카드 ── */
    .map-card{padding:0;overflow:hidden;position:relative;}
    #map{width:100%;height:820px;}

    #hover-popup{
      position:absolute;top:14px;right:14px;background:var(--card);
      border:1px solid var(--border);border-radius:8px;padding:7px 12px;
      font-size:12px;color:var(--text);z-index:1000;display:none;
      pointer-events:none;max-width:200px;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,.1);
    }
    #info-bar{
      position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
      background:rgba(30,41,59,.82);color:#fff;font-size:11px;padding:6px 16px;
      border-radius:20px;z-index:1000;pointer-events:none;white-space:nowrap;
    }
    #toast{
      position:absolute;bottom:54px;left:50%;transform:translateX(-50%);
      background:rgba(30,41,59,.92);color:#fff;font-size:12px;padding:8px 18px;
      border-radius:20px;z-index:9999;opacity:0;transition:opacity .2s;
      pointer-events:none;white-space:nowrap;
    }
    #toast.show{opacity:1;}

    #name-modal{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      background:var(--card);border:1px solid var(--border);border-radius:12px;
      padding:20px;width:260px;max-width:80vw;z-index:9999;display:none;
      flex-direction:column;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.16);
    }
    #name-modal h3{font-size:14px;font-weight:700;color:var(--text);}
    #name-input{
      width:100%;padding:9px 11px;font-size:16px;border:1px solid var(--border2);
      border-radius:8px;outline:none;font-family:inherit;color:var(--text);
    }
    #name-input:focus{border-color:var(--accent);}
    .mbtn-row{display:flex;gap:8px;}
    .mbtn-row button{
      flex:1;min-height:40px;padding:9px;font-size:13px;border-radius:8px;
      cursor:pointer;border:1px solid var(--border2);font-weight:600;font-family:inherit;
    }
    #confirm-name{background:var(--accent);color:#fff;border-color:transparent;}
    #confirm-name:hover{background:#1d4ed8;}
    #cancel-name{background:var(--card2);color:var(--muted);}
    #cancel-name:hover{color:var(--text);}

    @media(max-width:1023px){
      .toolbar-grid{grid-template-columns:repeat(2,1fr);}
      #map{height:560px;}
      .site-header{padding:12px 14px;}
      .page{padding:0 14px 60px;}
    }
    @media(max-width:767px){
      .toolbar-grid{grid-template-columns:1fr;}
      .site-header{padding:10px 12px;}
      .logo-sep,.logo-title{display:none;}
      .page{padding:0 12px 50px;}
      .intro-box{font-size:12px;padding:10px 12px;}
      #map{height:440px;}
      .a-card{padding:12px 14px;}
      #info-bar{font-size:10px;padding:5px 12px;}
    }
  </style>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/df-skin.css">
</head>
<body>

<div class="page-wrap">

  <header class="site-header">
    <div class="logo">
      <a href="https://runlab.ai.kr" class="logo-brand">RUN<em>LAB</em></a>
      <div class="logo-sep"></div>
      <div class="logo-title">경계 드로잉 도구</div>
    </div>
    <a href="https://runlab.ai.kr" class="header-back">← RunLab 홈</a>
  </header>

  <div class="page">

    <div class="intro-box">
      <strong>한국 행정구역(시도·시군구) 경계 위에 원하는 영역을 직접 그려보세요.</strong>
      폴리곤·사각형 도구로 연구 대상 구역을 그리고 이름을 지정한 뒤, GeoJSON으로 내보내거나 기존 파일을 불러와 이어서 편집할 수 있습니다.
    </div>

    <!-- ── 상단: 툴바 ── -->
    <div class="toolbar-grid">

      <div class="a-card">
        <div class="a-card-title">기본 행정구역</div>
        <div class="base-btn-list">
          <button class="base-btn active" id="btn-sido"><span class="b-dot" style="background:#4A90D9"></span>시도 경계</button>
          <button class="base-btn" id="btn-sigungu"><span class="b-dot" style="background:#2ECC9A"></span>시군구 경계</button>
          <button class="base-btn" id="btn-none"><span class="b-dot" style="background:#ccc"></span>경계 숨기기</button>
        </div>
        <div class="selected-region" id="selected-region-box">
          <div class="selected-region-hint">
            <span>지도에서 클릭한 지역 (다중 선택 가능)</span>
            <button class="selected-region-clear" id="clear-region-btn">전체 해제</button>
          </div>
          <div class="selected-region-list" id="selected-region-list"></div>
          <button class="btn btn-outline" id="download-region-btn">⬇ 선택 지역 경계 다운로드</button>
        </div>
      </div>

      <div class="a-card">
        <div class="a-card-title">그리기 도구</div>
        <div class="tool-btn-row">
          <button class="tool-btn" id="btn-polygon">▲ 폴리곤</button>
          <button class="tool-btn" id="btn-rect">▭ 사각형</button>
        </div>
      </div>

      <div class="a-card layer-card">
        <div class="a-card-title">내 레이어</div>
        <div id="layer-list" class="layer-list">
          <div id="empty-note" class="empty-hint">도구를 선택해 지도 위에<br>영역을 그려보세요.</div>
        </div>
      </div>

      <div class="a-card">
        <div class="btn-row">
          <button class="btn btn-primary" id="export-btn">⬇ GeoJSON 내보내기</button>
          <button class="btn btn-outline" id="import-btn">⬆ GeoJSON 불러오기</button>
          <button class="btn btn-danger" id="clear-btn">🗑 전체 삭제</button>
        </div>
      </div>

    </div>

    <!-- ── 하단: 지도 ── -->
    <div class="a-card map-card">
      <div id="map"></div>
      <div id="hover-popup"></div>
      <div id="info-bar">행정구역 위에 마우스를 올리면 이름을 확인할 수 있습니다</div>
      <div id="toast"></div>
      <div id="name-modal">
        <h3>레이어 이름</h3>
        <input id="name-input" type="text" placeholder="예: 연구 대상 구역">
        <div class="mbtn-row">
          <button id="cancel-name">취소</button>
          <button id="confirm-name">확인</button>
        </div>
      </div>
    </div>

  </div>
</div>
<input type="file" id="file-input" accept=".geojson,.json" style="display:none">

const COLORS=['#E84393','#7B61FF','#FF6B35','#00B386','#F5A623','#E24B4A','#0073E6','#2ECC71'];
let colorIdx=0,myLayers=[],selectedId=null,pendingLayer=null,drawHandler=null,activeDrawBtn=null,baseLayer=null,currentBase='sido';
const selectedRegions=new Map();

const map=L.map('map',{zoomControl:true}).setView([36.5,127.8],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:18}).addTo(map);
const drawnItems=new L.FeatureGroup().addTo(map);

function makeBoundaryLayer(data,color){
  return L.geoJSON(data,{
    style:{color,weight:1.5,fillColor:color,fillOpacity:0.06,opacity:0.75},
    onEachFeature:(feat,layer)=>{
      const name=feat.properties.name||feat.properties.NAME||'이름 없음';
      const key=feat.properties.code||name;
      layer.on('mouseover',function(e){
        if(!selectedRegions.has(key))this.setStyle({fillOpacity:.2,weight:2.5});
        const el=document.getElementById('hover-popup');
        el.textContent=name; el.style.display='block';
      });
      layer.on('mouseout',function(){
        if(!selectedRegions.has(key))this.setStyle({fillOpacity:.06,weight:1.5});
        document.getElementById('hover-popup').style.display='none';
      });
      layer.on('click',()=>toggleBoundarySelection(key,feat,layer,name));
    }
  });
}

function clearBoundarySelection(){
  selectedRegions.clear();
  renderSelectedRegions();
}

function toggleBoundarySelection(key,feat,layer,name){
  if(selectedRegions.has(key)){
    try{baseLayer.resetStyle(layer);}catch(e){}
    selectedRegions.delete(key);
    showToast(`"${name}" 선택 해제`);
  }else{
    layer.setStyle({weight:3.5,color:'#F5A623',fillColor:'#F5A623',fillOpacity:.35,opacity:1});
    layer.bringToFront();
    selectedRegions.set(key,{feat,layer,name});
    showToast(`"${name}" 선택됨`);
  }
  renderSelectedRegions();
}

function renderSelectedRegions(){
  const box=document.getElementById('selected-region-box');
  const list=document.getElementById('selected-region-list');
  const btn=document.getElementById('download-region-btn');
  if(!selectedRegions.size){box.classList.remove('show');list.innerHTML='';return;}
  box.classList.add('show');
  list.innerHTML='';
  selectedRegions.forEach((v,key)=>{
    const div=document.createElement('div');
    div.className='selected-region-item';
    div.innerHTML=`<span class="sri-name" title="${v.name}">${v.name}</span><span class="sri-del" title="선택 해제">&times;</span>`;
    div.querySelector('.sri-del').addEventListener('click',()=>{
      try{baseLayer.resetStyle(v.layer);}catch(e){}
      selectedRegions.delete(key);
      renderSelectedRegions();
    });
    list.appendChild(div);
  });
  btn.textContent=`⬇ 선택 지역 경계 다운로드 (${selectedRegions.size})`;
}

document.getElementById('clear-region-btn').addEventListener('click',clearBoundarySelection);

function downloadGeoJSON(features,filename){
  const blob=new Blob([JSON.stringify({type:'FeatureCollection',features},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
}

document.getElementById('download-region-btn').addEventListener('click',()=>{
  if(!selectedRegions.size)return;
  const values=[...selectedRegions.values()];
  const features=values.map(v=>v.feat);
  const fname=values.length===1?values[0].name:`선택지역_${values.length}개`;
  downloadGeoJSON(features,fname.replace(/\s+/g,'_')+'.geojson');
  showToast(`${values.length}개 지역 경계 다운로드 시작`);
});

function setBaseLayer(type){
  if(baseLayer){map.removeLayer(baseLayer);baseLayer=null;}
  currentBase=type;
  clearBoundarySelection();
  document.querySelectorAll('.base-btn').forEach(b=>b.classList.remove('active'));
  if(type==='sido'){baseLayer=makeBoundaryLayer(SIDO_DATA,'#4A90D9').addTo(map);document.getElementById('btn-sido').classList.add('active');}
  else if(type==='sigungu'){baseLayer=makeBoundaryLayer(SIGUNGU_DATA,'#2ECC9A').addTo(map);document.getElementById('btn-sigungu').classList.add('active');}
  else{document.getElementById('btn-none').classList.add('active');}
  drawnItems.bringToFront();
}

setBaseLayer('sido');

document.getElementById('btn-sido').addEventListener('click',()=>setBaseLayer('sido'));
document.getElementById('btn-sigungu').addEventListener('click',()=>setBaseLayer('sigungu'));
document.getElementById('btn-none').addEventListener('click',()=>setBaseLayer('none'));

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

function renderLayers(){
  const list=document.getElementById('layer-list');
  const empty=document.getElementById('empty-note');
  if(!myLayers.length){list.innerHTML='';list.appendChild(empty);return;}
  if(empty.parentNode)empty.parentNode.removeChild(empty);
  list.innerHTML='';
  myLayers.forEach(l=>{
    const div=document.createElement('div');
    div.className='layer-item'+(l.id===selectedId?' selected':'');
    div.innerHTML=`<div class="l-dot" style="background:${l.color}"></div><span class="l-name" title="${l.name}">${l.name}</span><span class="l-del" title="삭제">&times;</span>`;
    div.addEventListener('click',e=>{if(!e.target.classList.contains('l-del'))selectLayer(l.id);});
    div.querySelector('.l-del').addEventListener('click',()=>deleteLayer(l.id));
    list.appendChild(div);
  });
}

function selectLayer(id){
  selectedId=id;
  myLayers.forEach(l=>l.leaflet.setStyle({opacity:l.id===id?1:.4,fillOpacity:l.id===id?.35:.1}));
  renderLayers();
  const f=myLayers.find(l=>l.id===id);
  if(f){try{map.fitBounds(f.leaflet.getBounds(),{padding:[30,30]});}catch(e){}}
}

function deleteLayer(id){
  const f=myLayers.find(l=>l.id===id);
  if(f)drawnItems.removeLayer(f.leaflet);
  myLayers=myLayers.filter(l=>l.id!==id);
  if(selectedId===id)selectedId=null;
  renderLayers();showToast('레이어 삭제됨');
}

function openNameModal(layer){
  pendingLayer=layer;
  const inp=document.getElementById('name-input');
  inp.value='영역 '+(myLayers.length+1);
  document.getElementById('name-modal').style.display='flex';
  setTimeout(()=>inp.select(),60);
}

function confirmName(){
  const name=document.getElementById('name-input').value.trim()||('영역 '+(myLayers.length+1));
  if(!pendingLayer)return;
  const color=COLORS[colorIdx++%COLORS.length];
  pendingLayer.setStyle({color,fillColor:color,weight:2.5,opacity:1,fillOpacity:.3});
  drawnItems.addLayer(pendingLayer);
  const id=Date.now();
  myLayers.push({id,name,color,leaflet:pendingLayer});
  selectedId=id;pendingLayer=null;
  document.getElementById('name-modal').style.display='none';
  renderLayers();showToast(`"${name}" 추가됨`);
}

document.getElementById('confirm-name').addEventListener('click',confirmName);
document.getElementById('cancel-name').addEventListener('click',()=>{document.getElementById('name-modal').style.display='none';pendingLayer=null;});
document.getElementById('name-input').addEventListener('keydown',e=>{if(e.key==='Enter')confirmName();if(e.key==='Escape')document.getElementById('cancel-name').click();});

function stopDraw(){
  if(drawHandler){try{drawHandler.disable();}catch(e){}drawHandler=null;}
  if(activeDrawBtn){activeDrawBtn.classList.remove('active');activeDrawBtn=null;}
  document.getElementById('info-bar').textContent='행정구역 위에 마우스를 올리면 이름을 확인할 수 있습니다';
}

function startDraw(type){
  stopDraw();
  const btn=type==='polygon'?document.getElementById('btn-polygon'):document.getElementById('btn-rect');
  btn.classList.add('active');activeDrawBtn=btn;
  document.getElementById('info-bar').textContent=type==='polygon'?'클릭으로 꼭짓점 추가 · 더블클릭으로 완성 · ESC 취소':'드래그로 사각형 영역 · ESC 취소';
  const opts={shapeOptions:{color:'#7B61FF',fillColor:'#7B61FF',weight:2,opacity:.9,fillOpacity:.15}};
  drawHandler=type==='polygon'?new L.Draw.Polygon(map,opts):new L.Draw.Rectangle(map,opts);
  drawHandler.enable();
}

document.getElementById('btn-polygon').addEventListener('click',()=>startDraw('polygon'));
document.getElementById('btn-rect').addEventListener('click',()=>startDraw('rect'));
map.on(L.Draw.Event.CREATED,e=>{stopDraw();openNameModal(e.layer);});
document.addEventListener('keydown',e=>{if(e.key==='Escape')stopDraw();});

document.getElementById('export-btn').addEventListener('click',()=>{
  if(!myLayers.length){showToast('내보낼 레이어가 없습니다');return;}
  const features=[];
  myLayers.forEach(l=>{
    const g=l.leaflet.toGeoJSON();
    const fs=g.type==='FeatureCollection'?g.features:[g];
    fs.forEach(f=>{f.properties=Object.assign({},f.properties,{name:l.name,color:l.color});features.push(f);});
  });
  downloadGeoJSON(features,'boundaries.geojson');
  showToast('GeoJSON 다운로드 시작');
});

document.getElementById('import-btn').addEventListener('click',()=>document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      const features=data.features||(data.type==='Feature'?[data]:[]);
      let cnt=0;
      features.forEach(f=>{
        const color=(f.properties&&f.properties.color)||COLORS[colorIdx++%COLORS.length];
        const name=(f.properties&&f.properties.name)||('가져온 영역 '+(myLayers.length+1));
        const lyr=L.geoJSON(f,{style:{color,fillColor:color,weight:2.5,opacity:.9,fillOpacity:.3}});
        drawnItems.addLayer(lyr);
        myLayers.push({id:Date.now()+cnt,name,color,leaflet:lyr});cnt++;
      });
      renderLayers();
      try{map.fitBounds(drawnItems.getBounds(),{padding:[20,20]});}catch(e){}
      showToast(`${cnt}개 레이어 불러옴`);
    }catch(e){showToast('파일을 읽을 수 없습니다');}
  };
  reader.readAsText(file);e.target.value='';
});

document.getElementById('clear-btn').addEventListener('click',()=>{
  if(!myLayers.length){showToast('삭제할 레이어가 없습니다');return;}
  if(!confirm(`레이어 ${myLayers.length}개를 모두 삭제할까요?`))return;
  drawnItems.clearLayers();myLayers=[];selectedId=null;renderLayers();
  showToast('전체 삭제됨');
});
</script>
