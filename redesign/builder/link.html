<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>링크 빌더 — RunLab</title>
<link rel="icon" type="image/png" href="/img/mfg.png">
<meta property="og:title" content="링크 빌더 — RunLab">
<meta property="og:description" content="여러 HTML 파일을 업로드하고 허브 페이지를 자동 생성하세요">
<meta property="og:image" content="https://runlab.kr/img/OG_IMAGE.jpg">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc;--card:#fff;--card2:#f1f5f9;
  --border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.15);
  --text:#1e293b;--muted:#64748b;--dim:#94a3b8;
  --accent:#2563eb;--accent2:#6366f1;
  --amber:#d97706;--green:#059669;--red:#dc2626;--orange:#ea580c;
  --r:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Sans KR','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(37,99,235,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}

.page-wrap{max-width:1400px;width:100%;margin:0 auto;position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}
.site-header{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(248,250,252,.95);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:12px;}
.logo-brand{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:var(--accent);letter-spacing:2px;text-decoration:none;}
.logo-brand em{color:#ea580c;font-style:normal;}
.logo-sep{width:1px;height:16px;background:var(--border2);flex-shrink:0;}
.logo-title{font-size:13px;color:var(--muted);}
.logo-title span{color:var(--accent);}
.header-right{display:flex;align-items:center;gap:10px;}
.header-back{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--border2);padding:5px 14px;border-radius:8px;transition:.2s;}
.header-back:hover{color:var(--text);border-color:rgba(0,0,0,.3);}
.save-btn{display:flex;align-items:center;gap:6px;padding:7px 16px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .2s;font-family:inherit;}
.save-btn:hover{opacity:.88;}
.save-btn svg{flex-shrink:0;}
.save-btn-alt{display:flex;align-items:center;gap:6px;padding:7px 16px;background:transparent;border:1.5px solid var(--accent);border-radius:8px;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;transition:.2s;font-family:inherit;}
.save-btn-alt:hover{background:rgba(37,99,235,.08);}

/* workspace: 업로드 영역 아래 좌측 메뉴 → 미리보기 순으로 세로 배치 (다른 빌더 페이지와 동일) */
.workspace{display:flex;flex-direction:column;}

/* top upload bar (design.md §8·§11 기준) */
.upload-bar{padding:16px 24px;border-bottom:1px solid var(--border2);background:var(--bg);}
.a-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:16px 18px;}
.a-card-title{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px;}

/* left panel: 업로드 영역 바로 아래, 전체 너비로 배치 */
.left-panel{width:100%;background:var(--card);border-bottom:1px solid var(--border2);}
.panel-body{padding:14px 16px;}
.panel-sec{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--border);}
.panel-sec h3{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;}
.panel-sec.hidden{display:none;}
.settings-grid{display:grid;grid-template-columns:1fr;gap:10px;}
@media(min-width:768px){.settings-grid{grid-template-columns:2fr 2fr 1fr;align-items:start;}}

/* upload zone */
.upload-zone{border:2px dashed rgba(37,99,235,.3);border-radius:10px;padding:28px 18px;text-align:center;cursor:pointer;transition:all .2s;position:relative;background:rgba(37,99,235,.03);}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--accent);background:rgba(37,99,235,.07);}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.upload-icon{font-size:32px;margin-bottom:8px;}
.upload-main{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px;}
.upload-sub{font-size:11px;color:var(--muted);}

/* form controls */
.form-row{margin-bottom:7px;}
.form-row label{display:block;font-size:.7rem;color:var(--muted);margin-bottom:3px;}
.form-input,.form-select{width:100%;background:var(--card2);border:1px solid var(--border2);color:var(--text);border-radius:6px;padding:5px 8px;font-size:.78rem;outline:none;font-family:inherit;}
.form-input:focus,.form-select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.1);}
textarea.form-input{resize:vertical;min-height:38px;line-height:1.4;}

/* file count badge */
.file-badge{font-size:.68rem;font-weight:700;background:var(--accent);color:#fff;border-radius:10px;padding:1px 7px;margin-left:6px;}

/* file editor (드롭박스 선택 + 단일 편집 영역) */
.file-editor{display:grid;grid-template-columns:1fr;gap:10px;}
@media(min-width:768px){.file-editor{grid-template-columns:1fr 2fr;align-items:start;}}
.fe-select-row{display:flex;align-items:center;gap:6px;}
.fe-select-row .form-select{flex:1;min-width:0;}
.fe-btn{background:var(--card2);border:1px solid var(--border2);color:var(--muted);font-size:12px;cursor:pointer;padding:5px 9px;border-radius:6px;transition:.15s;flex-shrink:0;font-family:inherit;}
.fe-btn:hover{color:var(--text);border-color:rgba(0,0,0,.3);}
.fe-btn.fe-del:hover{color:var(--red);border-color:rgba(220,38,38,.4);background:rgba(220,38,38,.08);}
.fe-edit-row{display:flex;align-items:center;gap:6px;}
.fe-edit-row .form-input{flex:1;min-width:0;}
.fi-icon-wrap{position:relative;flex-shrink:0;}
.fi-icon{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;}
.fi-color-input{width:30px;height:30px;flex-shrink:0;border:none;cursor:pointer;border-radius:6px;padding:0;}

/* emoji picker */
.emoji-picker{position:absolute;top:28px;left:0;background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:8px;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.12);width:196px;}
.emoji-picker.hidden{display:none;}
.ep-btn{background:transparent;border:none;font-size:17px;cursor:pointer;padding:3px;border-radius:4px;transition:.1s;}
.ep-btn:hover{background:var(--card2);}

/* divider */
.dash-divider{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.dash-divider-line{flex:1;height:1px;background:var(--border);}
.dash-divider-label{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);}

/* canvas area */
.canvas-area{padding:20px 24px 40px;background:var(--bg);}
.canvas-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px;color:var(--dim);text-align:center;gap:10px;}
.canvas-empty .ce-icon{font-size:2.8rem;}
.canvas-empty p{font-size:.85rem;color:var(--muted);}

/* panel-body 빈 상태: 파일 미업로드 시 한 줄로 최소화 */
.panel-empty{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--dim);text-align:center;}
.panel-empty .ce-icon{font-size:1rem;line-height:1;}
.panel-empty p{font-size:.75rem;color:var(--muted);}

/* hub preview */
.hub-preview-wrap{display:none;}
.hub-preview-wrap.on{display:block;}
.hp-title{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;margin-bottom:6px;}
.hp-sub{font-size:13px;color:var(--muted);margin-bottom:24px;}
.hp-grid{display:grid;gap:16px;}
.hp-card{border-radius:var(--r);padding:20px;transition:.2s;color:#fff;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;min-height:150px;}
.hp-card::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.1);pointer-events:none;}
.hp-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.15);}
.hp-card-icon{font-size:26px;}
.hp-card-title{font-size:15px;font-weight:700;}
.hp-card-desc{font-size:12px;opacity:.85;line-height:1.5;flex:1;}
.hp-card-fn{font-size:10px;opacity:.5;font-family:'Space Mono',monospace;margin-top:4px;}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--card2);}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#94a3b8;}

@media(max-width:640px){
  .canvas-area{padding:14px 14px 40px;}
  .site-header{padding:10px 14px;}
  .logo-sep,.logo-title{display:none;}
  .header-right{gap:6px;}
  .save-btn,.save-btn-alt{font-size:12px;padding:6px 10px;}
  .save-btn svg,.save-btn-alt svg{display:none;}
  .form-input,.form-select{font-size:16px;}
  .hp-grid{grid-template-columns:1fr!important;}
}
</style>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/df-skin.css">
</head>
<body>
<div class="page-wrap">

<header class="site-header">
  <div class="logo">
    <a href="/" class="logo-brand">RUN<em>LAB</em></a>
    <span class="logo-sep"></span>
    <div class="logo-title"><span>링크</span> 빌더</div>
  </div>
  <div class="header-right">
    <button class="save-btn-alt" id="downloadSingleBtn" style="display:none;" onclick="downloadSingle()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
      단일 파일 저장
    </button>
    <button class="save-btn" id="downloadBtn" style="display:none;" onclick="downloadHub()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      허브 다운로드
    </button>
    <a href="/" class="header-back">← RunLab 홈</a>
  </div>
</header>

<!-- 상단 업로드 바 (design.md §11 기준) -->
<div class="upload-bar">
  <div class="a-card">
    <div class="a-card-title">① HTML 파일 업로드</div>
    <div class="upload-zone" id="uploadZone" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
      <input type="file" accept=".html,.htm" multiple onchange="handleFiles(this.files)">
      <div class="upload-icon">📂</div>
      <div class="upload-main">HTML 파일 선택</div>
      <div class="upload-sub">또는 드래그 · 여러 파일 동시 선택 가능</div>
    </div>
  </div>
</div>

<div class="workspace">

  <!-- LEFT PANEL (허브 설정 + 파일 목록 통합 스크롤 영역) -->
  <div class="left-panel">

    <div class="panel-body" id="panelBody">

      <!-- 허브 설정 -->
      <div class="panel-sec hidden" id="settingsSec">
        <h3>허브 페이지 설정</h3>
        <div class="settings-grid">
          <div class="form-row">
            <label>페이지 제목</label>
            <input class="form-input" id="hubTitle" value="My Hub" oninput="renderPreview()" placeholder="My Hub">
          </div>
          <div class="form-row">
            <label>부제목</label>
            <input class="form-input" id="hubSubtitle" value="페이지 목록" oninput="renderPreview()" placeholder="페이지 목록">
          </div>
          <div class="form-row" style="margin-bottom:0;">
            <label>카드 열 수</label>
            <select class="form-select" id="hubColumns" onchange="renderPreview()">
              <option value="2">2열</option>
              <option value="3" selected>3열</option>
              <option value="4">4열</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 파일 편집 (드롭박스 선택) -->
      <div class="panel-empty" id="listEmpty">
        <div class="ce-icon">📂</div>
        <p>HTML 파일을 업로드하면 목록이 표시됩니다</p>
      </div>
      <div class="file-editor" id="fileEditor" style="display:none;">
        <div class="form-row" style="margin-bottom:0;">
          <label>파일 선택</label>
          <div class="fe-select-row">
            <select class="form-select" id="fileSelect" onchange="selectFile(this.value)"></select>
            <button class="fe-btn" onclick="moveFile(-1)" title="순서 위로">▲</button>
            <button class="fe-btn" onclick="moveFile(1)" title="순서 아래로">▼</button>
            <button class="fe-btn fe-del" onclick="removeFile(selectedId)" title="삭제">✕</button>
          </div>
        </div>
        <div class="form-row" style="margin-bottom:0;">
          <label>카드 설정 (아이콘 · 제목 · 설명 · 색상)</label>
          <div class="fe-edit-row" id="fileEditBody"></div>
        </div>
      </div>

    </div>

  </div>

  <!-- CANVAS AREA -->
  <div class="canvas-area" id="canvasArea">
    <div class="canvas-empty" id="emptyState">
      <div class="ce-icon">🔗</div>
      <p>위에서 HTML 파일을 업로드하면<br>허브 페이지 미리보기가 표시됩니다</p>
    </div>
    <div class="hub-preview-wrap" id="hubPreviewWrap">
      <div class="dash-divider">
        <div class="dash-divider-line"></div>
        <span class="dash-divider-label">미리보기</span>
        <div class="dash-divider-line"></div>
      </div>
      <div id="hpTitle" class="hp-title"></div>
      <div id="hpSub" class="hp-sub"></div>
      <div id="hpGrid" class="hp-grid"></div>
    </div>
  </div>

</div>
</div><!-- .page-wrap -->

<script>
var files = [];
var selectedId = null;
var EMOJIS = ['📄','📊','📈','📉','🗂️','🔧','⚙️','🎯','🚀','💡','🔍','📝','🛠️','🎨','📌','⭐','🌐','💼','🔗','📋','🏷️','📦','🧩','🔑','💎','🌟','🗃️','📁'];
var COLORS = ['#2563eb','#7c3aed','#059669','#dc2626','#d97706','#0891b2','#be185d','#4f46e5','#0d9488','#65a30d','#ea580c','#6d28d9'];

function onDragOver(e){ e.preventDefault(); document.getElementById('uploadZone').classList.add('drag-over'); }
function onDragLeave(e){ document.getElementById('uploadZone').classList.remove('drag-over'); }
function onDrop(e){
  e.preventDefault();
  document.getElementById('uploadZone').classList.remove('drag-over');
  handleFiles(e.dataTransfer.files);
}

function handleFiles(fl){
  var arr = Array.from(fl).filter(function(f){ return f.name.match(/\.html?$/i); });
  if(!arr.length) return;
  var base = files.length;
  var promises = arr.map(function(f, i){ return readFile(f, base + i); });
  Promise.all(promises).then(function(results){
    results.forEach(function(r){ files.push(r); });
    if(results.length) selectedId = results[0].id;
    renderPanel();
    renderPreview();
  });
}

function readFile(f, idx){
  return new Promise(function(resolve){
    var reader = new FileReader();
    reader.onload = function(e){
      var html = e.target.result;
      var titleMatch = html.match(/<title[^>]*>([^<]*)<\/title>/i);
      var descMatch = html.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']*)["']/i)
                   || html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+name=["']description["']/i);
      var title = titleMatch ? titleMatch[1].trim() : f.name.replace(/\.html?$/i,'');
      var desc = descMatch ? descMatch[1].trim() : '';
      var colorIdx = idx % COLORS.length;
      var emojiIdx = idx % EMOJIS.length;
      resolve({
        id: 'f' + Date.now() + Math.random().toString(36).slice(2),
        filename: f.name,
        title: title,
        desc: desc,
        icon: EMOJIS[emojiIdx],
        color: COLORS[colorIdx],
        content: html
      });
    };
    reader.readAsText(f);
  });
}

function renderPanel(){
  var count = files.length;
  var settingsSec = document.getElementById('settingsSec');
  var listEmpty = document.getElementById('listEmpty');
  var fileEditor = document.getElementById('fileEditor');
  var downloadBtn = document.getElementById('downloadBtn');

  if(count > 0){
    settingsSec.classList.remove('hidden');
    listEmpty.style.display = 'none';
    fileEditor.style.display = '';
    downloadBtn.style.display = '';
    document.getElementById('downloadSingleBtn').style.display = '';
  } else {
    settingsSec.classList.add('hidden');
    listEmpty.style.display = '';
    fileEditor.style.display = 'none';
    downloadBtn.style.display = 'none';
    document.getElementById('downloadSingleBtn').style.display = 'none';
  }

  var h3 = settingsSec.querySelector('h3');
  if(h3) h3.innerHTML = 'HTML 파일 업로드 <span class="file-badge">' + count + '</span>';

  if(!findFile(selectedId)) selectedId = count ? files[0].id : null;

  var sel = document.getElementById('fileSelect');
  sel.innerHTML = files.map(function(f, i){
    return '<option value="' + f.id + '"' + (f.id === selectedId ? ' selected' : '') + '>'
      + (i+1) + '. ' + escHtml(f.title || f.filename) + ' (' + escHtml(f.filename) + ')</option>';
  }).join('');

  renderEditor();
}

function selectFile(id){
  selectedId = id;
  renderEditor();
}

function renderEditor(){
  var body = document.getElementById('fileEditBody');
  var f = findFile(selectedId);
  if(!f){ body.innerHTML = ''; return; }

  var html = '';
  html += '<div class="fi-icon-wrap">';
  html += '<div class="fi-icon" id="icon_' + f.id + '" style="background:' + f.color + ';" onclick="toggleEmojiPicker(\'' + f.id + '\')">' + f.icon + '</div>';
  html += '<div class="emoji-picker hidden" id="ep_' + f.id + '">';
  EMOJIS.forEach(function(em){
    html += '<button class="ep-btn" onclick="setIcon(\'' + f.id + '\',\'' + em + '\')">' + em + '</button>';
  });
  html += '</div></div>';
  html += '<input class="form-input" value="' + escAttr(f.title) + '" oninput="setField(\'' + f.id + '\',\'title\',this.value)" placeholder="카드 제목">';
  html += '<input class="form-input" value="' + escAttr(f.desc) + '" oninput="setField(\'' + f.id + '\',\'desc\',this.value)" placeholder="카드 설명 (선택)">';
  html += '<input type="color" class="fi-color-input" value="' + f.color + '" oninput="setColor(\'' + f.id + '\',this.value)" title="카드 색상">';
  body.innerHTML = html;
}

function moveFile(dir){
  var i = files.findIndex(function(f){ return f.id === selectedId; });
  var j = i + dir;
  if(i < 0 || j < 0 || j >= files.length) return;
  var tmp = files[i]; files[i] = files[j]; files[j] = tmp;
  renderPanel();
  renderPreview();
}

function setField(id, key, val){
  var f = findFile(id);
  if(!f) return;
  f[key] = val;
  if(key === 'title'){
    var opt = document.querySelector('#fileSelect option[value="' + id + '"]');
    var i = files.indexOf(f);
    if(opt) opt.textContent = (i+1) + '. ' + (f.title || f.filename) + ' (' + f.filename + ')';
  }
  renderPreview();
}

function setColor(id, val){
  var f = findFile(id);
  if(f){
    f.color = val;
    var el = document.getElementById('icon_' + id);
    if(el) el.style.background = val;
    renderPreview();
  }
}

function setIcon(id, emoji){
  var f = findFile(id);
  if(f){
    f.icon = emoji;
    var el = document.getElementById('icon_' + id);
    if(el) el.textContent = emoji;
    toggleEmojiPicker(id);
    renderPreview();
  }
}

function toggleEmojiPicker(id){
  document.querySelectorAll('.emoji-picker').forEach(function(p){
    if(p.id !== 'ep_' + id) p.classList.add('hidden');
  });
  var ep = document.getElementById('ep_' + id);
  if(ep) ep.classList.toggle('hidden');
}

document.addEventListener('click', function(e){

function removeFile(id){
  files = files.filter(function(f){ return f.id !== id; });
  renderPanel();
  renderPreview();
}

function findFile(id){
  for(var i=0;i<files.length;i++){ if(files[i].id===id) return files[i]; }
  return null;
}

function renderPreview(){
  var emptyState = document.getElementById('emptyState');
  var previewWrap = document.getElementById('hubPreviewWrap');

  if(!files.length){
    emptyState.style.display = '';
    previewWrap.classList.remove('on');
    return;
  }
  emptyState.style.display = 'none';
  previewWrap.classList.add('on');

  var title = document.getElementById('hubTitle').value || 'My Hub';
  var sub = document.getElementById('hubSubtitle').value || '';
  var cols = document.getElementById('hubColumns').value;

  document.getElementById('hpTitle').textContent = title;
  var subEl = document.getElementById('hpSub');
  subEl.textContent = sub;
  subEl.style.display = sub ? '' : 'none';

  var grid = document.getElementById('hpGrid');
  grid.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';

  var cardsHtml = '';
  files.forEach(function(f){
    cardsHtml += '<div class="hp-card" style="background:' + f.color + ';">';
    cardsHtml += '<div class="hp-card-icon">' + f.icon + '</div>';
    cardsHtml += '<div class="hp-card-title">' + escHtml(f.title || f.filename) + '</div>';
    if(f.desc) cardsHtml += '<div class="hp-card-desc">' + escHtml(f.desc) + '</div>';
    cardsHtml += '<div class="hp-card-fn">' + escHtml(f.filename) + '</div>';
    cardsHtml += '</div>';
  });
  grid.innerHTML = cardsHtml;
}

function trigger(html, name){
  var blob = new Blob([html], {type:'text/html'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

function escHtml(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
