<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>위치 정보 빌더 — DataForge</title>
  <link rel="icon" type="image/png" href="/img/mfg.png">
  <meta property="og:title" content="위치 정보 빌더 — DataForge">
  <meta property="og:description" content="주소 검색 또는 구글 맵 URL로 위도·경도를 추출하고 지도로 확인합니다.">
  <meta property="og:image" content="https://dataforge.ai.kr/img/OG_IMAGE.jpg">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}

    :root{
      --bg:#f8fafc;
      --card:#ffffff;
      --card2:#f1f5f9;
      --border:rgba(0,0,0,.1);
      --border2:rgba(0,0,0,.15);
      --text:#1e293b;
      --muted:#64748b;
      --dim:#94a3b8;
      --accent:#2563eb;
      --accent2:#6366f1;
      --amber:#d97706;
      --green:#059669;
      --red:#dc2626;
      --orange:#ea580c;
      --r:10px;
    }

    body{
      font-family:'Noto Sans KR','Segoe UI',system-ui,-apple-system,sans-serif;
      background:var(--bg);color:var(--text);
      min-height:100vh;font-size:14px;line-height:1.6;
    }

    body::before{
      content:'';position:fixed;inset:0;
      background-image:
        linear-gradient(rgba(37,99,235,.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(37,99,235,.04) 1px,transparent 1px);
      background-size:40px 40px;pointer-events:none;z-index:0;
    }

    /* ── 헤더 ── */
    .site-header{
      padding:14px 24px;border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;
      background:rgba(248,250,252,.95);backdrop-filter:blur(16px);
      position:sticky;top:0;z-index:1000;
    }
    .logo{display:flex;align-items:center;gap:12px;}
    .logo-brand{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;
                color:var(--accent);letter-spacing:2px;text-decoration:none;}
    .logo-brand em{color:#ea580c;font-style:normal;}
    .logo-sep{width:1px;height:16px;background:var(--border2);flex-shrink:0;}
    .logo-title{font-size:13px;color:var(--muted);}
    .header-back{font-size:12px;color:var(--muted);text-decoration:none;
                 border:1px solid var(--border2);padding:5px 14px;border-radius:8px;transition:.2s;}
    .header-back:hover{color:var(--text);border-color:rgba(0,0,0,.3);}

    /* ── 레이아웃 ── */
    .page-wrap{max-width:1400px;margin:0 auto;position:relative;}
    .page{padding:0 24px 80px;}

    .intro-box{
      background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.15);
      border-radius:10px;padding:12px 16px;font-size:13px;color:var(--muted);
      line-height:1.7;margin-top:20px;margin-bottom:16px;
    }
    .intro-box strong{color:var(--text);}

    /* ── 세로 배치: 검색 영역 위 → 지도 아래 (전체 너비) ── */
    .two-col{display:flex;flex-direction:column;gap:16px;}

    /* ── 카드 ── */
    .a-card{
      background:var(--card);border:1px solid var(--border);
      border-radius:var(--r);padding:16px 18px;margin-bottom:16px;
    }
    .a-card:last-child{margin-bottom:0;}
    .a-card-title{
      font-size:10px;font-weight:700;color:var(--muted);
      letter-spacing:.07em;text-transform:uppercase;margin-bottom:14px;
    }

    /* ── 탭 ── */
    .stat-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px;}
    .stat-tab{
      padding:10px 18px;font-size:12px;font-weight:700;
      background:none;border:none;border-bottom:2px solid transparent;
      color:var(--muted);cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap;
    }
    .stat-tab:hover{color:var(--text);}
    .stat-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
    .stat-panel{display:none;}
    .stat-panel.active{display:block;}

    /* ── 입력 ── */
    .search-row{display:flex;gap:8px;}
    .search-input{
      flex:1;border:1px solid var(--border2);border-radius:8px;
      padding:10px 12px;font-size:13px;font-family:inherit;
      background:var(--card);color:var(--text);outline:none;transition:.2s;
    }
    .search-input:focus{border-color:var(--accent);}
    .url-input{
      width:100%;border:1px solid var(--border2);border-radius:8px;
      padding:10px 12px;font-size:12px;font-family:'Space Mono',monospace;
      background:var(--card);color:var(--text);outline:none;transition:.2s;margin-bottom:8px;
    }
    .url-input:focus{border-color:var(--accent);}

    /* ── 버튼 ── */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;
         font-size:12px;font-weight:700;font-family:inherit;
         border:none;border-radius:8px;cursor:pointer;transition:all .2s;white-space:nowrap;}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-primary:hover:not(:disabled){background:#1d4ed8;}
    .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
    .btn-outline{background:transparent;border:1px solid var(--border2);color:var(--muted);}
    .btn-outline:hover{color:var(--text);border-color:rgba(0,0,0,.3);}
    .btn-green{background:var(--green);color:#fff;}
    .btn-green:hover{background:#047857;}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

    /* ── 검색 결과 목록 ── */
    .result-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
    .result-item{
      display:flex;align-items:flex-start;gap:10px;
      padding:10px 12px;background:var(--card2);
      border:1px solid var(--border);border-radius:8px;
      cursor:pointer;transition:all .2s;
    }
    .result-item:hover,.result-item.active{border-color:var(--accent);background:rgba(37,99,235,.06);}
    .result-num{
      font-family:'Space Mono',monospace;font-size:10px;font-weight:700;
      color:#fff;background:var(--accent);width:20px;height:20px;
      border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
    }
    .result-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px;}
    .result-addr{font-size:11px;color:var(--muted);line-height:1.5;}
    .result-coords{
      font-family:'Space Mono',monospace;font-size:10px;color:var(--accent);margin-top:3px;
    }

    /* ── 좌표 패널 ── */
    .coord-panel{
      display:none;background:rgba(37,99,235,.05);border:1px solid rgba(37,99,235,.18);
      border-radius:10px;padding:14px 16px;margin-top:12px;
    }
    .coord-panel.show{display:block;}
    .coord-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
    .coord-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
    .coord-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;}
    .coord-val{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--accent);}
    .coord-name{font-size:11px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    /* ── 복사 버튼 ── */
    .copy-btn{
      display:inline-flex;align-items:center;gap:4px;
      font-size:10px;font-weight:700;padding:3px 9px;
      border:1px solid var(--border2);border-radius:4px;
      background:transparent;color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;
    }
    .copy-btn:hover{color:var(--text);border-color:rgba(0,0,0,.3);}
    .copy-btn.copied{color:var(--green);border-color:var(--green);}

    /* ── 지도 (전체 너비, 크게) ── */
    #map{
      height:640px;border-radius:var(--r);border:1px solid var(--border);
      background:var(--card2);z-index:1;
    }

    /* ── 번호 마커: 검색 결과 목록의 번호와 1:1 매칭 ── */
    .num-marker{
      width:28px;height:28px;border-radius:50%;
      background:var(--accent);color:#fff;
      font-family:'Space Mono',monospace;font-size:12px;font-weight:700;
      display:flex;align-items:center;justify-content:center;
      border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);
      transition:transform .15s,background .15s;
    }
    .num-marker.sel{background:var(--orange);transform:scale(1.3);}

    /* ── 저장 목록 ── */
    .save-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;}
    .save-item{
      display:flex;align-items:center;gap:8px;
      padding:8px 10px;background:var(--card2);
      border:1px solid var(--border);border-radius:6px;font-size:12px;
    }
    .save-item-name{font-weight:700;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .save-item-coords{font-family:'Space Mono',monospace;font-size:10px;color:var(--accent);white-space:nowrap;}
    .save-item-del{background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;padding:0 2px;transition:.2s;}
    .save-item-del:hover{color:var(--red);}

    /* ── 상태 ── */
    .status-bar{
      display:none;align-items:center;gap:8px;
      padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600;margin-top:10px;
    }
    .status-bar.show{display:flex;}
    .status-bar.loading{background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.2);color:var(--accent);}
    .status-bar.error{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);color:var(--red);}
    .spinner{width:14px;height:14px;border:2px solid rgba(37,99,235,.2);
             border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
    @keyframes spin{to{transform:rotate(360deg);}}

    .empty-hint{
      text-align:center;padding:24px;color:var(--dim);font-size:12px;
    }

    @media(max-width:900px){
      #map{height:480px;}
      .coord-grid{grid-template-columns:1fr 1fr;}
      .site-header{padding:12px 14px;}
      .page{padding:0 14px 60px;}
    }
    @media(max-width:640px){
      .site-header{padding:10px 12px;}
      .logo-sep,.logo-title{display:none;}
      .page{padding:0 12px 50px;}
      .intro-box{font-size:12px;padding:10px 12px;}
      .search-row{flex-wrap:wrap;}
      .search-input{font-size:16px;}
      .url-input{font-size:16px;}
      .btn{min-height:44px;}
      .btn-row{gap:6px;}
      #map{height:400px;}
      .coord-val{font-size:14px;}
      .stat-tab{padding:8px 12px;font-size:11px;}
      .a-card{padding:12px 14px;}
    }
  </style>
</head>
<body>

<div class="page-wrap">

  <header class="site-header">
    <div class="logo">
      <a href="https://dataforge.ai.kr" class="logo-brand">DATA<em>FORGE</em></a>
      <div class="logo-sep"></div>
      <div class="logo-title">위치 정보 빌더</div>
    </div>
    <a href="https://dataforge.ai.kr" class="header-back">← DataForge 홈</a>
  </header>

  <div class="page">

    <div class="intro-box">
      <strong>주소 검색 또는 구글 맵 URL로 위도·경도를 즉시 추출합니다.</strong>
      OpenStreetMap Nominatim 기반으로 API 키 없이 무료로 동작합니다. 여러 위치를 저장하고 CSV로 내보낼 수 있습니다.
    </div>

    <div class="two-col">

      <!-- ── 상단: 검색 패널 ── -->
      <div>

        <!-- 검색 카드 -->
        <div class="a-card">
          <div class="a-card-title">위치 검색</div>

          <div class="stat-tabs">
            <button class="stat-tab active" onclick="switchTab('addr')">📍 주소 검색</button>
            <button class="stat-tab"        onclick="switchTab('url')">🔗 구글 맵 URL</button>
          </div>

          <!-- 주소 검색 패널 -->
          <div id="panel-addr" class="stat-panel active">
            <div class="search-row">
              <input type="text" class="search-input" id="addrInput"
                     placeholder="예: 강남구 테헤란로, 경복궁, Seoul"
                     onkeydown="if(event.key==='Enter')searchAddr()">
              <button class="btn btn-primary" onclick="searchAddr()">검색</button>
            </div>
          </div>

          <!-- 구글 맵 URL 패널 -->
          <div id="panel-url" class="stat-panel">
            <input type="text" class="url-input" id="urlInput"
                   placeholder="https://www.google.com/maps/@37.5665,126.9780,15z">
            <button class="btn btn-primary" style="width:100%;" onclick="parseUrl()">좌표 추출</button>
          </div>

          <div class="status-bar" id="statusBar">
            <div class="spinner"></div><span id="statusMsg">검색 중…</span>
          </div>
        </div>

        <!-- 검색 결과 -->
        <div class="a-card" id="resultCard" style="display:none;">
          <div class="a-card-title">검색 결과</div>
          <div class="result-list" id="resultList"></div>
        </div>

        <!-- 선택된 좌표 -->
        <div class="a-card" id="coordCard" style="display:none;">
          <div class="a-card-title" style="display:flex;align-items:center;justify-content:space-between;">
            <span>추출된 좌표</span>
            <button class="btn btn-outline" style="font-size:10px;padding:4px 10px;" onclick="saveLocation()">+ 목록에 저장</button>
          </div>

          <div class="coord-grid">
            <div class="coord-box">
              <div class="coord-label">위도 (Lat)</div>
              <div class="coord-val" id="dispLat">—</div>
              <div class="coord-name" id="dispName">—</div>
            </div>
            <div class="coord-box">
              <div class="coord-label">경도 (Lng)</div>
              <div class="coord-val" id="dispLng">—</div>
            </div>
          </div>

          <div class="btn-row">
            <button class="copy-btn" id="copyLat"   onclick="copyVal('lat')">📋 위도</button>
            <button class="copy-btn" id="copyLng"   onclick="copyVal('lng')">📋 경도</button>
            <button class="copy-btn" id="copyBoth"  onclick="copyVal('both')">📋 위도, 경도</button>
            <button class="copy-btn" id="copyComma" onclick="copyVal('comma')">📋 쉼표 형식</button>
          </div>
        </div>

        <!-- 저장 목록 -->
        <div class="a-card" id="saveCard" style="display:none;">
          <div class="a-card-title" style="display:flex;align-items:center;justify-content:space-between;">
            <span>저장된 위치</span>
            <div style="display:flex;gap:6px;">
              <button class="copy-btn" onclick="exportCsv()">⬇ CSV</button>
              <button class="copy-btn" onclick="exportJson()">⬇ JSON</button>
              <button class="copy-btn" onclick="clearSaved()" style="color:var(--red);">전체 삭제</button>
            </div>
          </div>
          <div class="save-list" id="saveList"></div>
        </div>

      </div>

      <!-- ── 하단: 지도 (전체 너비) ── -->
      <div>
        <div class="a-card" style="padding:0;overflow:hidden;">
          <div id="map"></div>
        </div>
      </div>

    </div>

  </div>
</div>

<script>
// ── 지도 초기화 ──
const map = L.map('map').setView([36.5, 127.5], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19,
}).addTo(map);

let markers = [];
let selectedLat = null, selectedLng = null, selectedName = '';
let savedLocations = JSON.parse(localStorage.getItem('df_locations') || '[]');

// ── 탭 전환 ──
function switchTab(id) {
  document.querySelectorAll('.stat-tab').forEach((t, i) => {
    const panels = ['addr', 'url'];
    t.classList.toggle('active', panels[i] === id);
  });
  document.querySelectorAll('.stat-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
}

// ── 상태 표시 ──
function setStatus(type, msg) {
  const bar = document.getElementById('statusBar');
  bar.className = 'status-bar show ' + type;
  document.getElementById('statusMsg').textContent = msg;
}
function clearStatus() {
  document.getElementById('statusBar').className = 'status-bar';
}

// ── 주소 검색 ──
async function searchAddr() {
  const q = document.getElementById('addrInput').value.trim();
  if (!q) return;
  clearMarkers();
  setStatus('loading', '검색 중…');

  try {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&addressdetails=1`,
      { headers: { 'Accept-Language': 'ko,en' } }
    );
    const data = await res.json();
    clearStatus();

    if (!data.length) {
      setStatus('error', '검색 결과가 없습니다. 다른 키워드를 입력해보세요.');
      return;
    }
    showResults(data.map(d => ({
      lat: parseFloat(d.lat),
      lng: parseFloat(d.lon),
      name: d.name || d.display_name.split(',')[0],
      addr: d.display_name,
    })));
  } catch (e) {
    setStatus('error', '검색 실패: ' + e.message);
  }
}

// ── 구글 맵 URL 파싱 ──
function parseUrl() {
  const url = document.getElementById('urlInput').value.trim();
  let lat = null, lng = null;

  // 패턴 1: @lat,lng,zoom
  let m = url.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/);
  if (m) { lat = parseFloat(m[1]); lng = parseFloat(m[2]); }

  // 패턴 2: ?q=lat,lng
  if (!lat) {
    m = url.match(/[?&]q=(-?\d+\.?\d*),(-?\d+\.?\d*)/);
    if (m) { lat = parseFloat(m[1]); lng = parseFloat(m[2]); }
  }

  // 패턴 3: /place/ URL에 포함된 좌표
  if (!lat) {
    m = url.match(/!3d(-?\d+\.?\d*)!4d(-?\d+\.?\d*)/);
    if (m) { lat = parseFloat(m[1]); lng = parseFloat(m[2]); }
  }

  if (lat && lng) {
    clearMarkers();
    selectLocation(lat, lng, 'Google Maps 위치');
  } else {
    setStatus('error', 'URL에서 좌표를 찾을 수 없습니다. 공유 URL인지 확인하세요.');
  }
}

// ── 번호 마커 아이콘 ──
function numIcon(n, sel) {
  return L.divIcon({
    className: '',
    html: '<div class="num-marker' + (sel ? ' sel' : '') + '">' + n + '</div>',
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    popupAnchor: [0, -16],
  });
}

function highlightMarker(idx) {
  markers.forEach((m, j) => {
    m.setIcon(numIcon(j + 1, j === idx));
    if (j === idx) m.setZIndexOffset(1000); else m.setZIndexOffset(0);
  });
}

// ── 결과 목록 렌더링 ──
function showResults(results) {
  const card = document.getElementById('resultCard');
  const list = document.getElementById('resultList');
  card.style.display = '';
  list.innerHTML = '';

  results.forEach((r, i) => {
    const el = document.createElement('div');
    el.className = 'result-item';
    el.innerHTML = `
      <div class="result-num">${i + 1}</div>
      <div style="flex:1;min-width:0;">
        <div class="result-name">${r.name}</div>
        <div class="result-addr">${r.addr}</div>
        <div class="result-coords">${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}</div>
      </div>
    `;
    const selectThis = () => {
      document.querySelectorAll('.result-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      highlightMarker(i);
      selectLocation(r.lat, r.lng, r.name);
    };
    el.onclick = selectThis;

    // 지도에 번호 마커 추가 (목록 번호와 동일)
    const marker = L.marker([r.lat, r.lng], { icon: numIcon(i + 1, false) })
      .addTo(map)
      .bindPopup(`<b>${i + 1}. ${r.name}</b><br>${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}`);
    marker.on('click', selectThis);
    markers.push(marker);

    list.appendChild(el);
  });

  // 지도 범위 조정
  if (results.length === 1) {
    map.setView([results[0].lat, results[0].lng], 15);
    markers[0].openPopup();
    highlightMarker(0);
    selectLocation(results[0].lat, results[0].lng, results[0].name);
    document.querySelector('.result-item').classList.add('active');
  } else {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.2));
  }
}

// ── 위치 선택 ──
function selectLocation(lat, lng, name) {
  selectedLat = lat;
  selectedLng = lng;
  selectedName = name;

  document.getElementById('dispLat').textContent  = lat.toFixed(6);
  document.getElementById('dispLng').textContent  = lng.toFixed(6);
  document.getElementById('dispName').textContent = name;
  document.getElementById('coordCard').style.display = '';

  map.setView([lat, lng], Math.max(map.getZoom(), 14));
}

// ── 마커 초기화 ──
function clearMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('coordCard').style.display = 'none';
  clearStatus();
}

// ── 복사 ──
function copyVal(type) {
  if (selectedLat === null) return;
  const texts = {
    lat:   selectedLat.toFixed(6),
    lng:   selectedLng.toFixed(6),
    both:  `${selectedLat.toFixed(6)}\t${selectedLng.toFixed(6)}`,
    comma: `${selectedLat.toFixed(6)}, ${selectedLng.toFixed(6)}`,
  };
  const idMap = { lat: 'copyLat', lng: 'copyLng', both: 'copyBoth', comma: 'copyComma' };
  navigator.clipboard.writeText(texts[type]).then(() => {
    const btn = document.getElementById(idMap[type]);
    btn.classList.add('copied');
    btn.textContent = '✓ 복사됨';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = { lat: '📋 위도', lng: '📋 경도', both: '📋 위도, 경도', comma: '📋 쉼표 형식' }[type];
    }, 1800);
  });
}

// ── 저장 ──
function saveLocation() {
  if (selectedLat === null) return;
  savedLocations.push({ name: selectedName, lat: selectedLat, lng: selectedLng });
  persistSaved();
  renderSaved();
}

function renderSaved() {
  const card = document.getElementById('saveCard');
  const list = document.getElementById('saveList');
  card.style.display = savedLocations.length ? '' : 'none';
  list.innerHTML = '';
  savedLocations.forEach((loc, i) => {
    const el = document.createElement('div');
    el.className = 'save-item';
    el.innerHTML = `
      <span class="save-item-name">${loc.name}</span>
      <span class="save-item-coords">${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}</span>
      <button class="save-item-del" onclick="removeLocation(${i})" title="삭제">✕</button>
    `;
    list.appendChild(el);
  });
}

function removeLocation(i) {
  savedLocations.splice(i, 1);
  persistSaved();
  renderSaved();
}

function clearSaved() {
  savedLocations = [];
  persistSaved();
  renderSaved();
}

function persistSaved() {
  localStorage.setItem('df_locations', JSON.stringify(savedLocations));
}

// ── 내보내기 ──
function exportCsv() {
  const rows = ['name,lat,lng', ...savedLocations.map(l => `"${l.name}",${l.lat},${l.lng}`)];
  download('locations.csv', '﻿' + rows.join('\n'), 'text/csv');
}

function exportJson() {
  download('locations.json', JSON.stringify(savedLocations, null, 2), 'application/json');
}

function download(filename, content, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── 지도 클릭으로 좌표 추출 ──
map.on('click', e => {
  const { lat, lng } = e.latlng;
  clearMarkers();
  const marker = L.marker([lat, lng]).addTo(map)
    .bindPopup(`${lat.toFixed(6)}, ${lng.toFixed(6)}`).openPopup();
  markers.push(marker);
  selectLocation(lat, lng, `지도 클릭 위치`);
});

// ── 초기 저장 목록 렌더 ──
renderSaved();
</script>
